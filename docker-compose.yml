version: '3.8'

services:
  agritech-api:
    build: .
    image: agritech-api:latest
    container_name: agritech-api-container
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - hf_model_cache:/root/.cache/huggingface
      - .:/app
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  hf_model_cache: